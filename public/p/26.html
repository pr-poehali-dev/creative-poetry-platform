<meta name="description" content="Ты нежною рукою прикоснулся,
Сказал: «Я тот же, Я всегда с Тобой».
Вдруг сильный ветер всколыхнулся,
Унес покой, а вместе — голос Твой.…
— Фастовщук Валентина Александровна">
