<meta name="description" content="Мне порой непонятно, что происходит,
И так часто, Иисус, вопрошаю к Тебе:
«Укажи в жизни то, что Ты, Господь, хочешь.
Какой путь избирать нужно далее мне?»…
— Фастовщук Валентина Александровна">
